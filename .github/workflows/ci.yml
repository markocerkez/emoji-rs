name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        emoji: ["2.16.0"]
        include:
          - { os: ubuntu-24.04, python: "3.13", emoji: "2.13.2" }
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel and install
        shell: bash
        run: |
          python -m pip install maturin pytest "emoji==${{ matrix.emoji }}"
          maturin build --release -o dist
          python -m pip install --no-index --find-links dist emoji-rs
      - name: Unit tests
        run: python -m pytest tests/test_basic.py -q
      - name: Differential test against emoji
        run: python -I tests/diff_test.py --n-fuzz 20000
      - name: emoji's own test suite with the Rust core enabled
        shell: bash
        run: |
          python -m pip download "emoji==${{ matrix.emoji }}" --no-deps --no-binary :all: -d upstream
          mkdir upstream/src && tar xzf upstream/emoji-${{ matrix.emoji }}.tar.gz -C upstream/src
          cd upstream/src/emoji-${{ matrix.emoji }}
          python -c "import emoji_rs, sys, pytest; assert emoji_rs.patch(); sys.exit(pytest.main(['-q', 'tests']))"
