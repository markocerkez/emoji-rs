[package]
name = "emoji-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated demojize, replace_emoji and emoji_list for the emoji package"
license = "BSD-3-Clause"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
