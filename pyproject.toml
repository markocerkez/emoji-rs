[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "emoji-rs"
version = "0.1.0"
description = "Rust-accelerated demojize, replace_emoji and emoji_list for the emoji package"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = ["emoji>=2.13,<3"]
keywords = ["emoji", "unicode", "emoji-package", "rust", "performance"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/markocerkez/emoji-rs"
Upstream = "https://github.com/carpedm20/emoji"

[tool.maturin]
python-source = "python"
module-name = "emoji_rs._core"
features = ["pyo3/extension-module"]
